# Fails when CHANGELOG.md is edited instead of appended, or when a change has no new entry.
name: changelog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  append-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check CHANGELOG.md is append-only and has an entry
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python scripts/check_changelog.py "$BASE_SHA" "$HEAD_SHA"
